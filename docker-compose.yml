services:
  postgres:
    image: postgres:16-alpine
    container_name: collabtrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabtrust
      POSTGRES_PASSWORD: collabtrust_password
      POSTGRES_DB: collabtrust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabtrust -d collabtrust"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
